<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<style>
/* Motion Source — Fall 2026 Internship Application */
.ms-form-wrapper {
  max-width: 820px;
  margin: 0 auto;
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
  overflow: hidden;
}
.ms-form-header {
  background: #fff;
  padding: 1.25rem 2.5rem;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ms-form-logo {
  height: 48px;
  width: auto;
  max-width: 240px;
  object-fit: contain;
  display: block;
}
.ms-form-body {
  padding: 2rem 2.5rem 2.5rem;
}
.ms-form-body h1 {
  font-size: 1.75rem;
  font-weight: 700;
  color: #1a1a2e;
  margin-bottom: 0.75rem;
  line-height: 1.3;
}
.ms-form-body > p {
  color: #5a5a6e;
  margin-bottom: 1.75rem;
}
.ms-section-title {
  font-size: 1.1rem;
  font-weight: 600;
  color: #1a1a2e;
  margin: 1.75rem 0 1rem;
  padding-bottom: 0.5rem;
  border-bottom: 2px solid #f97316;
}
.ms-section-title:first-of-type {
  margin-top: 0;
}
.ms-form-body .form-label {
  font-weight: 500;
  color: #2d2d3a;
}
.ms-form-body .form-control,
.ms-form-body .form-select {
  border-radius: 6px;
  border-color: #d1d5db;
}
.ms-form-body .form-control:focus,
.ms-form-body .form-select:focus {
  border-color: #f97316;
  box-shadow: 0 0 0 0.2rem rgba(249, 115, 22, 0.2);
}
.ms-submit-btn {
  background: #f97316;
  color: #fff;
  border: none;
  padding: 0.75rem 2.5rem;
  font-size: 1rem;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.2s ease;
}
.ms-submit-btn:hover:not(:disabled) {
  background: #ea580c;
}
.ms-submit-btn:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}
.ms-orange-strip {
  height: 4px;
  background: #f97316;
}
.ms-form-footer {
  padding: 1rem 2.5rem;
  text-align: center;
  font-size: 0.875rem;
  color: #6b7280;
  background: #f9fafb;
}
#thankYouScreen h2,
.ms-closed-screen h2 {
  color: #1a1a2e;
  margin-bottom: 1rem;
}
#thankYouScreen p,
.ms-closed-screen p {
  color: #5a5a6e;
  margin-bottom: 0.5rem;
}
.ms-closed-screen {
  text-align: center;
  padding: 2.5rem 1rem 1rem;
}
@media (max-width: 576px) {
  .ms-form-header {
    padding: 1rem 1.25rem;
  }
  .ms-form-logo {
    height: 40px;
    max-width: 200px;
  }
  .ms-form-body {
    padding: 1.25rem 1.25rem 1.75rem;
  }
  .ms-form-body h1 {
    font-size: 1.4rem;
  }
}
</style>

<div class="row sectionBlockLayout text-start" style="display: flex; flex-wrap: wrap; margin: 0px; min-height: auto; padding: 8px;">
  <div class="container" style="padding: 0px; display: flex; flex-wrap: wrap;">
    <div class="col-lg-12 columnBlockLayout" style="flex-grow: 1; display: flex; flex-direction: column; min-width: 250px;">
      <div class="ms-form-wrapper">
        <!-- Upload assets/motion-source-logo.png to Power Pages Web Files as motion-source-logo.png -->
        <div class="ms-form-header">
          <img src="/motion-source-logo.png" alt="Motion Source" class="ms-form-logo" />
        </div>
        <div class="ms-form-body">
          <h1>Motion Source Fall 2026 Internship Application</h1>
          <div id="submissionsClosedScreen" class="ms-closed-screen">
            <h2>Submissions Closed</h2>
            <p>Thank you for your interest in the Motion Source Fall 2026 Internship Program.</p>
            <p>Applications are no longer being accepted.</p>
          </div>
        </div>
        <div class="ms-orange-strip"></div>
        <div class="ms-form-footer">Motion Source Fall 2026 Internship Program</div>
      </div>
    </div>
  </div>
</div>
