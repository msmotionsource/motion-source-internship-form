<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motion Source Fall 2026 Internship Application</title>
    <link rel="icon" href="https://www.motion-source.com/favicon.ico" />
    <link rel="apple-touch-icon" href="https://www.motion-source.com/favicon.ico" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="internship-application.css" />
    <style>
      body {
        background: #f3f4f6;
        padding: 2rem 1rem;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="row sectionBlockLayout text-start" style="display: flex; flex-wrap: wrap; margin: 0; min-height: auto; padding: 8px;">
      <div class="container" style="padding: 0; display: flex; flex-wrap: wrap;">
        <div class="col-lg-12 columnBlockLayout" style="flex-grow: 1; display: flex; flex-direction: column; min-width: 250px;">
          <div class="ms-form-wrapper">
            <div class="ms-form-header">
              <img
                src="assets/motion-source-logo.png"
                alt="Motion Source"
                class="ms-form-logo"
              />
            </div>
            <div class="ms-form-body">
              <h1>Motion Source Fall 2026 Internship Application</h1>
              <div id="submissionsClosedScreen" class="ms-closed-screen">
                <h2>Submissions Closed</h2>
                <p>Thank you for your interest in the Motion Source Fall 2026 Internship Program.</p>
                <p>Applications are no longer being accepted.</p>
              </div>
            </div>
            <div class="ms-orange-strip"></div>
            <div class="ms-form-footer">Motion Source Fall 2026 Internship Program</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
